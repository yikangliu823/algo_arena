name: verify
on: [push, pull_request]
jobs:
  unit-types-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npx -y -p typescript@6.0.3 tsc -p verify/tsconfig.json
      - run: npm run mutation
        working-directory: functions
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mutation-report, path: functions/reports/mutation }
  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install -g firebase-tools@15.33.0
      - run: npm install
        working-directory: test/rules
      - run: firebase emulators:exec --only firestore --project demo-algoarena "bash test/rules/run-with-coverage.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rules-coverage, path: test/rules/rules-coverage-* }
  browser-mock:
    runs-on: ubuntu-24.04  # Playwright 1.57.0 cannot install browsers on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - run: python build_app.py && python e2e_b.py
        working-directory: test/e2e
  i6-emulator:
    runs-on: ubuntu-24.04  # Playwright 1.57.0 cannot install browsers on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install -g firebase-tools@15.33.0
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - run: firebase emulators:exec --only auth,firestore --project demo-algoarena "python verify/i6/i6_oracle.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: i6-result, path: verify/evidence/round3/i6/result.json }
  coach-wiring-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install -g firebase-tools@15.33.0
      - run: npm install
        working-directory: functions
      - run: bash functions/test/emulator/run.sh
