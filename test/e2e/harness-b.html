<!DOCTYPE html>
<!--
  @fileoverview Test harness page for the route B end-to-end test (e2e_b.py).
  It holds the shared mock Firebase state (window.__FB) used by mock-firebase.js in each iframe, adds one iframe of
  app.html per test user with a chosen clock skew, and runs coach-core.js, the same file the Cloud Function uses,
  against a fake Anthropic API and in-page quota and log storage.

  Author: Yikang (Richard) Liu, M.S. Candidate in Computer Science, Khoury College of Computer Sciences,
      Northeastern University
  Version: 1.0
  Created: October 29, 2026 · San Francisco, California, USA

  License: This project is licensed under the MIT License — see LICENSE.md for details.
  Copyright © 2026 Yikang (Richard) Liu.
  @license MIT
-->
<html><head><meta charset="utf-8"><title>AlgoArena route B harness</title>
<style>body{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#333}iframe{width:100%;height:900px;border:0;background:#fff}</style>
<script>
/* Shared state for mock-firebase.js: one Firestore store, one server clock (this page's), sign-in state per test user. */
/**
 * Shared mock state: documents, live subscriptions, sign-in state and display names per test user, refused writes
 * and uncaught frame errors. `now()` returns this page's clock, which is the mock server clock.
 */
window.__FB = { docs: new Map(), subs: new Set(), signedIn: {}, names: {}, refused: [], errs: [], now: () => Date.now() };
/**
 * Appends an iframe that loads app.html as test user `uid` with a device clock skew.
 * @param {string} name Frame name.
 * @param {string} uid Test user id, passed as the `u` query parameter.
 * @param {number=} skew Clock skew in ms, passed as the `skew` query parameter; defaults to 0.
 */
window.__FB.addFrame = (name, uid, skew = 0) => { const f = document.createElement("iframe"); f.name = name; f.src = "app.html?u=" + encodeURIComponent(uid) + "&skew=" + skew; document.body.appendChild(f); };
/**
 * Returns a deep copy of the stored document at `p`, or null when there is none.
 * @param {string} p Document path.
 * @return {?Object} The document copy.
 */
window.__FB.get = (p) => { const d = window.__FB.docs.get(p); return d === undefined ? null : JSON.parse(JSON.stringify(d)); };
</script>
<script type="module">
/* Server side of the mock: coach-core.js (the same file the Cloud Function uses) with a fake Anthropic API. */
import { runCoach } from "./coach-core.js";
const FB = window.__FB; FB.aiCalls = []; FB.aiFailNext = 0;
/**
 * Returns the UTC date (YYYY-MM-DD) of a time.
 * @param {number} ms Time in ms since the epoch.
 * @return {string} The date key.
 */
const day = (ms) => new Date(ms).toISOString().slice(0, 10);
/**
 * Fake Anthropic Messages API passed to coach-core.js as `fetch`.
 *
 * Records each call in FB.aiCalls (model, system prompt, API key, prompt length, whether a display name appears, the
 * forced tool name, and whether the 400-word budget is stated). While FB.aiFailNext is positive it decrements it and
 * returns HTTP 529. Otherwise it returns a canned class summary or personal report (citing the first candidate
 * resource id), as a tool_use block when tools are requested and as JSON text otherwise.
 * @param {string} url Request URL (unused).
 * @param {!Object} init Fetch init with JSON `body` and `headers`.
 * @return {!Promise<!Object>} A response-like object with `ok`, `status` and `json()`.
 */
function fakeAnthropic(url, init) {
  const body = JSON.parse(init.body); const prompt = body.messages[0].content;
  FB.aiCalls.push({ model: body.model, system: body.system, key: init.headers["x-api-key"], chars: prompt.length, names: /Alice|Bob|Host User/.test(prompt), tool: body.tool_choice ? body.tool_choice.name : null, budget: /fits in 400 words/.test(prompt) });
  if (FB.aiFailNext > 0) { FB.aiFailNext--; return Promise.resolve({ ok: false, status: 529, json: async () => ({ type: "error" }) }); }
  let j;
  if (/class-level summary/.test(prompt)) j = { overview: "The class did well on running-time questions.", prominent_knowledge_points: ["Insertion sort worst case"], common_error_patterns: ["Confusing best and worst case"], possible_confusion_signals: ["Θ(n) vs Θ(n²)"], suggested_follow_up: ["Review loop invariants"] };
  else { const ids = [...(prompt.split("CANDIDATES:")[1] || "").matchAll(/"id":"([^"]+)"/g)].map((m) => m[1]);
    j = { performance_summary: "Your answers suggest steady work on running time.", knowledge_points: ["Worst-case analysis (Q1)"], weak_or_risky_areas: ["Timing on Q2"], possible_confusions: [], next_steps: ["Redo Q2"], resource_ids: ids.slice(0, 1) }; }
  const content = body.tools ? [{ type: "tool_use", id: "t1", name: body.tool_choice.name, input: j }] : [{ type: "text", text: JSON.stringify(j) }];
  return Promise.resolve({ ok: true, status: 200, json: async () => ({ model: body.model, content, stop_reason: body.tools ? "tool_use" : "end_turn", usage: { input_tokens: 500, output_tokens: 80 } }) });
}
/** In-page implementation of the deps that coach-core.js expects, backed by FB.docs instead of the Admin SDK. */
const deps = {
  /** `now` reads the page clock, `fetch` is fakeAnthropic, and `apiKey` returns the test secret. */
  now: () => Date.now(), fetch: fakeAnthropic, apiKey: () => "sk-test-secret",
  /**
   * Returns whether `uid` is listed in meta/aiHosts or meta/admins.
   * @param {string} uid Caller uid.
   * @return {!Promise<boolean>} True for a host.
   */
  isHost: async (uid) => [FB.get("meta/aiHosts"), FB.get("meta/admins")].some((d) => d && (d.uids || []).includes(uid)),
  /**
   * Returns the caller's session when their public record names a host session, created less than 3 days ago, that
   * lists them as a participant.
   * @param {string} uid Caller uid.
   * @return {!Promise<({sid: string}|boolean)>} `{sid}` when the caller qualifies as a player, else false.
   */
  hasJoined: async (uid) => { const p = FB.get(`pub/${uid}`); if (!p || !p.sid || !p.host) return false;
    const s = FB.get(`data/users/${p.host}/profile/sessions/${p.sid}`); return s && Date.now() - (s.createdAt || 0) < 3 * 864e5 && (s.participants || []).some((x) => x && x.uid === uid) ? { sid: p.sid } : false; },
  /**
   * Returns whether a host's session has ended and how many participants it lists.
   * @param {string} uid Host uid.
   * @param {string} sid Session id.
   * @return {!Promise<?{ended: boolean, participants: number}>} The summary, or null when the session does not exist.
   */
  hostSession: async (uid, sid) => { const s = FB.get(`data/users/${uid}/profile/sessions/${sid}`); return s ? { ended: !!s.endAt, participants: (s.participants || []).length } : null; },
  /**
   * Increments the daily counter and, when `sid` is given, the session counter, unless a cap is reached.
   * The session cap is checked before the daily cap.
   * @param {{uid: string, day: string, dailyCap: number, sid: ?string, sessionCap: number}} options Keys and caps.
   * @return {!Promise<{ok: boolean, limit: (string|undefined)}>} `{ok: true}`, or `{ok: false, limit}` naming the cap.
   */
  consumeQuota: async ({ uid, day: d, dailyCap, sid, sessionCap }) => {
    const dk = `aiQuota/${uid}_${d}`, sk = sid ? `aiQuota/${uid}_s_${sid}` : null; const du = (FB.get(dk) || {}).count || 0, su = sk ? (FB.get(sk) || {}).count || 0 : 0;
    if (sk && su >= sessionCap) return { ok: false, limit: "session" }; if (du >= dailyCap) return { ok: false, limit: "daily" };
    FB.docs.set(dk, { uid, day: d, count: du + 1 }); if (sk) FB.docs.set(sk, { uid, sid, count: su + 1, cap: sessionCap }); return { ok: true }; },
  /**
   * Decrements the daily counter and, when `sid` is given, the session counter, never below zero.
   * @param {{uid: string, day: string, sid: ?string}} options Counter keys.
   * @return {!Promise<void>}
   */
  refundQuota: async ({ uid, day: d, sid }) => { for (const k of [`aiQuota/${uid}_${d}`, ...(sid ? [`aiQuota/${uid}_s_${sid}`] : [])]) { const c = (FB.get(k) || {}).count || 0; FB.docs.set(k, { ...(FB.get(k) || {}), count: Math.max(0, c - 1) }); } },
  /**
   * Stores a call-log entry under aiLog with a random id.
   * @param {!Object} e Log entry.
   * @return {!Promise<void>}
   */
  log: async (e) => { FB.docs.set(`aiLog/${Math.random().toString(36).slice(2)}`, e); },
};
/**
 * Mock callable-function endpoint: runs runCoach for "coach" after a 30 ms delay.
 * @param {string} name Function name; anything other than "coach" is refused.
 * @param {?string} uid Caller uid, or null when signed out.
 * @param {!Object} data Request payload.
 * @return {!Promise<!Object>} The runCoach result.
 * @throws {!Error} With code not_granted for an unknown function name; runCoach errors propagate.
 */
FB.callFunction = async (name, uid, data) => { if (name !== "coach") throw Object.assign(new Error("no such function"), { code: "not_granted" }); await new Promise((r) => setTimeout(r, 30)); return runCoach({ uid, data, deps }); };
</script></head><body></body></html>
