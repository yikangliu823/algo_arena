<script>
"use strict";
/* ===================== AlgoArena v2 (Live Classroom) ===================== */
const APP = { version: "3.0.0-b2", personalPrompt: "coach-personal-v1", classPrompt: "coach-class-v1" };
const ARTIFACT_URL = location.origin + location.pathname; // route B: the page's own address (GitHub Pages)
const DEFAULT_T = 20;
const DEFAULT_READ = 10; // v2.1: seconds the question is visible, locked, before answers open
const MAX_EVENTS = 400;

/* ---------- small utilities ---------- */
/**
 * Returns the first element matching a CSS selector.
 *
 * @param {string} s CSS selector.
 * @param {!ParentNode=} r Root to search; defaults to document.
 * @return {?Element} The first match, or null.
 */
const $ = (s, r = document) => r.querySelector(s);
/**
 * Returns every element matching a CSS selector as a real array.
 *
 * @param {string} s CSS selector.

/**
 * Starts the app: connects to the host's db and user services, checks sign-in and write access, loads the profile,
 * claims this device, then routes to the gate, name or home view.
 *
 * Optional capabilities (room, assets, sample, downloads) load in the background into C.
 *
 * @return {!Promise<void>} Resolves when boot routing finishes.
 */
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") return go("gate", { reason: "noclaude" });
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  C.db = db; C.user = user; DB = db;
  if (!db || !user) return go("gate", { reason: "signin" });
  S.uid = await user.id();
  if (!S.uid) return go("gate", { reason: "signin" });
  [S.isAdmin, S.isOwner, S.canWrite] = await Promise.all([user.canEdit().catch(() => false), user.isOwner().catch(() => false), user.can("data.write").catch(() => null)]);
  if (S.canWrite === false) return go("gate", { reason: "viewonly" });
  Promise.all(["room", "assets", "sample", "downloads"].map((n) => claude.use(n).then((x) => { C[n] = x; }).catch(() => {}))).then(() => rerender());
  try { S.profile = await dget(P.profile()); } catch (e) { return go("gate", { reason: "error", msg: errMsg(e) }); }
  await claimDevice();
  if (!S.profile || !S.profile.displayName) return go("name", {});
  go("home"); await loadHome(); await autoResume();
}

/**
 * Marks this device as the user's active device and watches for another device taking over.
 *
 * Records the previous device in S.tookOverFrom when it differs. When a later snapshot names another device,
 * sets S.displaced, leaves any live game while keeping its state, and re-renders.
 *
 * @return {!Promise<void>} Resolves once the claim is written and the listener attached.
 */
async function claimDevice() {
  const cur = await dget(P.device()).catch(() => null);
  const prev = cur && cur.deviceId;
  await dset(P.device(), { deviceId: S.deviceId, at: now(), prev: prev || null });
  S.displaced = false;
  if (prev && prev !== S.deviceId) S.tookOverFrom = { from: prev, at: now() };
  if (claimDevice.unsub) claimDevice.unsub();
  claimDevice.unsub = DB.doc(P.device()).onSnapshot((s) => {
    const d = s.exists ? s.data() : null;
    const out = !!(d && d.deviceId && d.deviceId !== S.deviceId);
    if (out !== S.displaced) { S.displaced = out; if (out) { leaveLive(true); } rerender(); }
  }, () => {});
}

    dlist(P.joined()).then((x) => { S.joined = x.sort((a, b) => (b.at || 0) - (a.at || 0)); }),

/**
 * Runs async tasks with at most n running at once, preserving result order.
 *
 * The inner run() worker repeatedly takes the next unstarted task until none remain.
 * @param {!Array<function(): !Promise<*>>} fns The task factories.
 * @param {number} n The maximum concurrency.
 * @return {!Promise<!Array<*>>} The results, indexed like fns.
 */
async function pool(fns, n) { const out = []; let i = 0; const run = async () => { while (i < fns.length) { const k = i++; out[k] = await fns[k](); } }; await Promise.all(Array.from({ length: Math.min(n, fns.length) }, run)); return out; }

 * @param {!Object} q The question.
 * @param {number} order Its position in the set.

 */
function qDoc(q, order) { const d = { ...q, order }; delete d.id; delete d._id; return d; }
/**

 * @param {string} setId The set id.
 * @param {!Array<!Object>} qs The questions; each needs an id.
 * @param {number=} startOrder The order of the first question (default 0).
 * @return {!Promise<void>}
 */
async function writeQuestions(setId, qs, startOrder = 0) { await pool(qs.map((q, k) => () => dset(`${P.setQ(setId)}/${q.id}`, qDoc(q, startOrder + k))), 6); }

Use ONLY the evidence below. The evidence is a record of answers and timing; it is not a measurement of the student's ability.
Rules:
- Speak to the student ("you"). Be concrete and kind, no praise filler.
- Treat every interpretation as tentative: write "may", "suggests", "could indicate". Never state that the student does not understand something, and never judge their capability.
- Tie each point to specific question numbers from the evidence.
- If the evidence is thin (few answers), say so.
- possible_confusions: name pairs of concepts the wrong answers might reflect mixing up, phrased as a possibility. Empty list if no evidence.
- resource_ids: choose 1 to 3 ids from CANDIDATES only, most relevant first. Do not invent ids or URLs.
- Length: performance_summary at most 50 words; each list has 1 to 3 items of at most 18 words, so the whole report fits in 400 words.
Return ONLY a JSON object, no prose, with keys: "performance_summary" (string), "knowledge_points" (array of strings), "weak_or_risky_areas" (array), "possible_confusions" (array), "next_steps" (array), "resource_ids" (array of ids).

EVIDENCE:
${JSON.stringify({ totals: snap.totals, by_topic: snap.by_topic, questions: snap.questions })}

CANDIDATES:
${JSON.stringify(cands.map((c) => ({ id: c.id, title: c.title, keywords: c.tags })))}`;
}
/**
 * Formats the observed-evidence bullet lines of a personal report.
 *
 * @param {!Object} snap A snapshot from personalSnapshot().
 * @return {!Array<string>} Markdown bullet lines.
 */
function evidenceLines(snap) {
  const t = snap.totals; const topics = Object.entries(snap.by_topic).sort((a, b) => b[1].total - a[1].total).slice(0, 4).map(([k, v]) => `${k} ${v.correct}/${v.total}`).join(", ");
  return [`- Answered ${t.answered} of ${t.questions} questions; ${t.correct} correct (${pct(t.correct, t.questions)}).`, `- Median response time ${t.median_rt_s == null ? "not available" : t.median_rt_s + " s"}; score ${Number(t.score || 0).toLocaleString()}${t.rank ? `, rank ${t.rank} of ${t.players}` : ""}.`, topics ? `- By topic (correct/total): ${topics}.` : ""].filter(Boolean);
}
/**
 * Composes a personal report as Markdown and trims it to at most 400 words.
 *
 * Trims list items first, then summary sentences, then truncates the summary to 25 words.
 *
 * @param {!Object} snap A snapshot from personalSnapshot().
 * @param {!Object} j The parsed model reply.
 * @param {!Array<!Object>} res The chosen resources to list.
 * @return {string} The report Markdown.

function composePersonal(snap, j, res) {

   * Normalizes a model list field to at most three trimmed, non-empty strings.
   *

   * @return {!Array<string>} The cleaned items.

  const L = (a) => (Array.isArray(a) ? a : []).map((x) => String(x).trim()).filter(Boolean).slice(0, 3);

   * Assembles the report Markdown from the current (possibly trimmed) parts.
   *
   * @return {string} The report Markdown.

    "## AI interpretation (generated; not a measurement of ability)", parts.summary,
    parts.kp.length ? `**Knowledge points covered:** ${parts.kp.join("; ")}` : "", parts.weak.length ? `**Possible weak or risky areas:** ${parts.weak.join("; ")}` : "",
    parts.conf.length ? `**Concepts that may be confused:** ${parts.conf.join("; ")}` : "", parts.next.length ? "**Next steps:**" : "", ...parts.next.map((x) => "- " + x),

}
/**
 * Generates one personal report with the AI service and composes it.

 * @param {!Object} snap A snapshot from personalSnapshot().
 * @param {!Array<!Object>} cands Candidate resources from candidatesFor().
 * @return {!Promise<{md: string, json: *, model: ?string, tier: ?string, resources: !Array<string>,
 *     words: number}>} The report and its provenance.

async function generatePersonal(snap, cands) {
  let r = await sampleJson(personalPrompt(snap, cands, false), snap.session_id, "personal");

   * Keeps up to three unique candidates the model chose, falling back to the top candidate.
   *

   * @return {!Array<!Object>} The chosen resources.

/**

    await dset(path, X.ai[part.uid]);

  if (!md) return toast("This report isn't ready yet. Check back after the host's device finishes generating it.");
  S.openMd = { md, name: `AlgoArena report - ${j.title || sid}.md` }; openDialog(() => reportDialog(md, null));
};

/* ===================== start ===================== */
document.addEventListener("DOMContentLoaded", () => { boot().catch((e) => { console.error(e); go("gate", { reason: "error", msg: errMsg(e) }); }); });

</script>
